# Releases a beta of main: "Run workflow" in the Actions tab (or `gh workflow run release-beta.yml`). A
# maintenance branch like 1.x can have betas too ("Use workflow from" → 1.x). Nothing is released by pushing; a beta exists only when this runs.
#
#   1. tools/release works out the version from the branch's commits since its last stable
#      release, as release-please will: 1.1.0-beta.1, then 1.1.0-beta.2, ... (never lower than a
#      beta of the same major version already released).
#   2. ci-build.yml builds and signs it, like a stable release.
#   3. It is tagged (v1.1.0-beta.1) and published as a GitHub pre-release with its notes, and added
#      to the update feed: apps with "Beta versions" on offer it, and so do betas until the release
#      they lead to; others don't.
#
# The stable release comes from release-please's release PR (release-stable.yml).
name: Beta release

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: beta-release

jobs:
    prepare:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
            sha: ${{ steps.version.outputs.sha }}
        steps:
            # Anyone with write access can start a workflow; only admins may release.
            -   name: Validate Authorized Actor
                env:
                    GH_TOKEN: ${{ github.token }}
                    ACTOR: ${{ github.triggering_actor }}
                #language=bash
                run: |
                    permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)
                    if [ "$permission" != admin ]; then
                      echo "::error::only admins can run this, not $ACTOR ($permission)" && exit 1
                    fi

            -   name: Check Branch
                env:
                    BRANCH: ${{ github.ref_name }}
                #language=bash
                run: |
                    if ! [[ "$BRANCH" =~ ^(main|[0-9]+\.x)$ ]]; then
                      echo "::error::betas are released from main or a maintenance branch like 1.x, not \"$BRANCH\"" && exit 1
                    fi

            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                with:
                    # The tags, to count from the last release and the betas since.
                    fetch-depth: 0

            -   uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
                with:
                    go-version-file: go.mod

            -   name: Version
                id: version
                #language=bash
                run: |
                    version=$(go run ./tools/release beta-version)
                    echo "Releasing $version"
                    echo "version=$version" >> "$GITHUB_OUTPUT"
                    echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    build:
        needs: prepare
        permissions:
            contents: read
            pull-requests: read
            # Windows signing's Azure login.
            id-token: write
        uses: ./.github/workflows/ci-build.yml
        with:
            ref: ${{ needs.prepare.outputs.sha }}
            version: ${{ needs.prepare.outputs.version }}
        # The "release" environment's signing secrets: a called workflow sees them only when passed on.
        secrets: inherit

    publish:
        needs: [ prepare, build ]
        runs-on: ubuntu-latest
        # SPARKLE_PRIVATE_KEY, which signs the macOS update, and REPO_SIGNING_KEY, Linux's repository.
        environment: release
        permissions:
            contents: write
        concurrency:
            # One writer of the update feed at a time (release-stable.yml writes it too).
            group: update-feed
            cancel-in-progress: false
        env:
            VERSION: ${{ needs.prepare.outputs.version }}
            SHA: ${{ needs.prepare.outputs.sha }}
            GH_TOKEN: ${{ github.token }}
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                with:
                    ref: ${{ needs.prepare.outputs.sha }}
                    fetch-depth: 0

            -   uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
                with:
                    go-version-file: go.mod

            -   uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
                with:
                    path: dist
                    merge-multiple: true

            -   uses: ./.github/actions/linux-repo
                with:
                    mode: sign
                    version: ${{ env.VERSION }}
                    signing-key: ${{ secrets.REPO_SIGNING_KEY }}
                    token: ${{ github.token }}

            -   name: Release
                #language=bash
                run: |
                    go run ./tools/release notes > "$RUNNER_TEMP/notes.md"
                    for f in "dist/Flock-$VERSION-macOS.dmg" "dist/Flock-Setup-$VERSION-x64.exe"; do
                      [ -f "$f" ] || { echo "::error::$f missing"; exit 1; }
                    done
                    # Linux: a .deb and an .rpm for each architecture.
                    [ "$(ls dist/flockphp*.deb dist/flockphp*.rpm 2>/dev/null | wc -l)" -eq 4 ] || { echo "::error::Linux packages missing"; ls dist; exit 1; }
                    gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$SHA" --prerelease --latest=false \
                      --title "Flock $VERSION" --notes-file "$RUNNER_TEMP/notes.md" dist/*

            -   uses: ./.github/actions/update-feed
                with:
                    version: ${{ env.VERSION }}
                    notes: ${{ runner.temp }}/notes.md
                    private-key: ${{ secrets.SPARKLE_PRIVATE_KEY }}
                    token: ${{ github.token }}

            -   uses: ./.github/actions/linux-repo
                with:
                    mode: index
                    version: ${{ env.VERSION }}
                    signing-key: ${{ secrets.REPO_SIGNING_KEY }}
                    token: ${{ github.token }}

    # A job of its own: the release is out either way, and a failed AUR push can run again from here.
    aur:
        name: AUR
        needs: [ prepare, publish ]
        runs-on: ubuntu-latest
        # AUR_SSH_KEY, which pushes to the AUR packages.
        environment: release
        permissions:
            contents: read
        env:
            VERSION: ${{ needs.prepare.outputs.version }}
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                with:
                    ref: ${{ needs.prepare.outputs.sha }}

            -   name: Download the .debs
                env:
                    GH_TOKEN: ${{ github.token }}
                #language=bash
                run: gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern 'flockphp_*.deb' --dir dist

            -   uses: ./.github/actions/aur
                with:
                    version: ${{ env.VERSION }}
                    ssh-key: ${{ secrets.AUR_SSH_KEY }}
                    token: ${{ github.token }}
