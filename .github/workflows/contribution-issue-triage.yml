# Issues opened by people without repository access need a maintainer's first review.
name: Issue Triage

on:
  issues:
    types: [ opened, assigned ]

permissions:
  contents: read
  issues: write

jobs:
  label:
    name: Label for Triage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod

      - name: Triage
        if: github.event.action == 'opened'
        run: go run ./tools/github issue triage
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assignment
        if: github.event.action == 'assigned'
        run: go run ./tools/github issue assignment
        env:
          GITHUB_TOKEN: ${{ github.token }}
