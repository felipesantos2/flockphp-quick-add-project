# Runs shared checks and delegates platform work while keeping one build run for release artifacts.
name: Build

on:
    workflow_dispatch:
    pull_request:
    merge_group:
    workflow_call:
        inputs:
            ref:
                description: Git ref to build (a release tag); defaults to the triggering ref.
                type: string
                default: ""
            version:
                description: Version to stamp into the builds (for example, 1.2.0).
                type: string
                default: ""

permissions:
    contents: read

concurrency:
    group: build-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: true

jobs:
    version:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                with:
                    ref: ${{ inputs.ref || github.event.pull_request.head.sha }}

            -   name: Version
                id: version
                env:
                    INPUT_VERSION: ${{ inputs.version }}
                    EVENT: ${{ github.event_name }}
                #language=bash
                run: |
                    if [ -n "$INPUT_VERSION" ]; then
                      version="$INPUT_VERSION"
                    elif [ "$EVENT" = merge_group ]; then
                      version=$(jq -r '."." // empty' .release-please-manifest.json)
                      version="${version:-dev-$(git rev-parse --short HEAD)}"
                    else
                      version="dev-$(git rev-parse --short HEAD)"
                    fi
                    if [ -z "$version" ] || [ "$version" = null ]; then
                      echo "::error::no version found" && exit 1
                    fi
                    echo "version=$version" >> "$GITHUB_OUTPUT"

    changes:
        runs-on: ubuntu-latest
        permissions:
            pull-requests: read
        outputs:
            go: ${{ steps.filter.outputs.go }}
            macos: ${{ steps.filter.outputs.macos }}
            windows: ${{ steps.filter.outputs.windows }}
            linux: ${{ steps.filter.outputs.linux }}
            translations: ${{ steps.filter.outputs.translations }}
            notices: ${{ steps.filter.outputs.notices }}
            tooling: ${{ steps.filter.outputs.tooling }}
            docs: ${{ steps.filter.outputs.docs }}
        steps:
            -   uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
                if: github.event_name == 'pull_request'
                id: filter
                with:
                    filters: |
                        go: &go
                          - 'cmd/**'
                          - 'internal/**'
                          - 'go.mod'
                          - 'go.sum'
                          - 'Makefile'
                          - '.github/workflows/ci-build.yml'
                        macos:
                          - *go
                          - 'macos/**'
                          - 'lang/**'
                          - '.github/workflows/ci-macos.yml'
                        windows:
                          - *go
                          - 'windows/**'
                          - 'lang/**'
                          - '.github/workflows/ci-windows.yml'
                        linux:
                          - *go
                          - 'linux/**'
                          - 'lang/**'
                          - '.github/workflows/ci-linux.yml'
                        translations:
                          - 'macos/**'
                          - 'windows/**'
                          - 'linux/**'
                          - 'lang/**'
                          - 'tools/i18n/**'
                          - '.github/workflows/ci-build.yml'
                        notices:
                          - *go
                          - 'macos/**'
                          - 'windows/**'
                          - 'THIRD_PARTY_NOTICES'
                          - 'tools/notices/**'
                        tooling:
                          - 'tools/**'
                          - 'go.mod'
                          - 'go.sum'
                          - '.github/workflows/**'
                        docs:
                          - 'docs/**'

    docs:
        name: Docs
        needs: changes
        if: needs.changes.outputs.docs == 'true'
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                with:
                    ref: ${{ github.event.pull_request.head.sha }}
            -   uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
                with:
                    go-version-file: go.mod
            -   name: Check
                run: go run ./tools/docslint

    go-test:
        name: Go ${{ matrix.check }} (${{ matrix.platform.name }})
        needs: changes
        if: github.event_name != 'pull_request' || needs.changes.outputs.go == 'true'
        strategy:
            fail-fast: false
            matrix:
                check: [ vet, test ]
                platform:
                    -   name: macOS
                        os: macos-26
                        flags: -race
                    -   name: Windows
                        os: windows-2025
                        flags: ""
                    -   name: Linux
                        os: ubuntu-24.04
                        flags: -race
                    -   name: Linux arm64
                        os: ubuntu-24.04-arm
                        flags: -race
        runs-on: ${{ matrix.platform.os }}
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                with:
                    ref: ${{ inputs.ref || github.event.pull_request.head.sha }}

            -   uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
                id: go
                with:
                    go-version-file: go.mod
                    cache: false

            -   name: Restore Go Cache
                id: go-cache
                uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
                with:
                    path: |
                        ${{ steps.go.outputs.GOCACHE }}
                        ${{ steps.go.outputs.GOMODCACHE }}
                    key: go-ci-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ matrix.check }}-${{ github.run_id }}-${{ github.run_attempt }}
                    restore-keys: |
                        go-ci-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ matrix.check }}-

            -   name: Vet
                if: matrix.check == 'vet'
                shell: bash
                run: go vet $(go list ./... | grep -v '^flock/tools/')

            -   name: Test
                if: matrix.check == 'test'
                shell: bash
                run: go test ${{ matrix.platform.flags }} $(go list ./... | grep -v '^flock/tools/')

            -   name: Save Go Cache
                if: ${{ !cancelled() && steps.go-cache.outcome == 'success' && steps.go-cache.outputs.cache-hit != 'true' }}
                uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
                with:
                    path: |
                        ${{ steps.go.outputs.GOCACHE }}
                        ${{ steps.go.outputs.GOMODCACHE }}
                    key: ${{ steps.go-cache.outputs.cache-primary-key }}

    generated:
        name: Generated Files
        needs: changes
        if: github.event_name != 'pull_request' || needs.changes.outputs.notices == 'true' || needs.changes.outputs.translations == 'true'
        runs-on: ubuntu-24.04
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                with:
                    ref: ${{ inputs.ref || github.event.pull_request.head.sha }}
            -   uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
                with:
                    go-version-file: go.mod
            -   name: Third-party notices
                if: github.event_name != 'pull_request' || needs.changes.outputs.notices == 'true'
                run: go run ./tools/notices -check

            # The apps' translation files are what lang/ and the apps' keys generate; run `make i18n`
            # after changing either.
            -   name: Translations
                if: github.event_name != 'pull_request' || needs.changes.outputs.translations == 'true'
                run: go run ./tools/i18n -check

            # How much of each language is translated, in the job's summary. A pull request that changes
            # the English of an existing key gets a reminder: a new meaning needs a new key (lang/README.md).
            -   name: Translation Status
                if: github.event_name != 'pull_request' || needs.changes.outputs.translations == 'true'
                env:
                    BASE_SHA: ${{ github.event.pull_request.base.sha }}
                #language=bash
                run: |
                    { echo '### Translations'; echo '```'; go run ./tools/i18n -status; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
                    [ -n "$BASE_SHA" ] || exit 0
                    git fetch --quiet --depth=1 origin "$BASE_SHA"
                    git show "$BASE_SHA:lang/en/app.json" > "$RUNNER_TEMP/en.json" 2>/dev/null || exit 0
                    changed=$(go run ./tools/i18n -changed "$RUNNER_TEMP/en.json")
                    [ -n "$changed" ] || exit 0
                    echo "::warning title=English texts changed::If a text's meaning changed, give it a new key so translators see it (lang/README.md)."
                    {
                      echo '### English texts changed'
                      echo "If a text's meaning changed, give it a new key, so translators see it (lang/README.md)."
                      echo '```'
                      echo "$changed"
                      echo '```'
                    } >> "$GITHUB_STEP_SUMMARY"

    tool-test:
        name: Tool Tests
        needs: changes
        if: github.event_name != 'pull_request' || needs.changes.outputs.tooling == 'true'
        runs-on: ubuntu-24.04
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                with:
                    ref: ${{ inputs.ref || github.event.pull_request.head.sha }}

            -   uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
                id: go
                with:
                    go-version-file: go.mod
                    cache: false

            -   name: Restore Go Cache
                id: go-cache
                uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
                with:
                    path: |
                        ${{ steps.go.outputs.GOCACHE }}
                        ${{ steps.go.outputs.GOMODCACHE }}
                    key: go-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
                    restore-keys: |
                        go-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.mod', 'go.sum') }}-

            -   name: Vet
                run: go vet ./tools/...

            -   name: Test
                run: go test ./tools/...

            -   name: Save Go Cache
                if: ${{ !cancelled() && steps.go-cache.outcome == 'success' && steps.go-cache.outputs.cache-hit != 'true' }}
                uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
                with:
                    path: |
                        ${{ steps.go.outputs.GOCACHE }}
                        ${{ steps.go.outputs.GOMODCACHE }}
                    key: ${{ steps.go-cache.outputs.cache-primary-key }}

    macos:
        if: github.event_name != 'pull_request' || needs.changes.outputs.macos == 'true'
        needs: [ version, changes ]
        uses: ./.github/workflows/ci-macos.yml
        with:
            ref: ${{ inputs.ref || github.event.pull_request.head.sha }}
            version: ${{ needs.version.outputs.version }}
            code: ${{ 'true' }}
        secrets: inherit

    windows:
        if: github.event_name != 'pull_request' || needs.changes.outputs.windows == 'true'
        needs: [ version, changes ]
        permissions:
            contents: read
            id-token: write
        uses: ./.github/workflows/ci-windows.yml
        with:
            ref: ${{ inputs.ref || github.event.pull_request.head.sha }}
            version: ${{ needs.version.outputs.version }}
            code: ${{ 'true' }}
        secrets: inherit

    linux:
        if: github.event_name != 'pull_request' || needs.changes.outputs.linux == 'true'
        needs: [ version, changes ]
        uses: ./.github/workflows/ci-linux.yml
        with:
            ref: ${{ inputs.ref || github.event.pull_request.head.sha }}
            version: ${{ needs.version.outputs.version }}
            code: ${{ 'true' }}
