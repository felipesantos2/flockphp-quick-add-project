# Renders the apps' windows with demo data for the website's docs (windows/Flock.Screenshots,
# macos/Sources/FlockScreenshots) and keeps the PNGs as run artifacts, by hand from the Actions
# tab. A workflow of its own, so these files never mix with the build artifacts that release-beta.yml
# and release-stable.yml publish.
name: Screenshots

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    windows:
        name: Windows
        runs-on: windows-2025
        env:
            NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            -   uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
                with:
                    dotnet-version: 10.0.x

            -   name: Cache NuGet Packages
                id: nuget-cache
                uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
                with:
                    path: ${{ github.workspace }}/.nuget/packages
                    key: nuget-${{ runner.os }}-${{ runner.arch }}-Screenshot build-${{ hashFiles('windows/**/*.csproj', 'windows/**/*.props', 'windows/**/*.targets', '**/NuGet.Config', '**/nuget.config', 'global.json') }}

            -   name: Render
                #language=powershell
                run: |
                    dotnet build windows/Flock.Screenshots -c Release -p:Platform=x64
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                    $exe = Get-ChildItem windows/Flock.Screenshots/bin/x64/Release -Recurse -Filter Flock.Screenshots.exe | Select-Object -First 1
                    & $exe.FullName --out screenshots
                    exit $LASTEXITCODE

            -   uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
                if: always()
                with:
                    name: screenshots-windows
                    path: screenshots/*.png
                    if-no-files-found: error

            -   name: Save NuGet Packages
                if: ${{ !cancelled() && steps.nuget-cache.outcome == 'success' && steps.nuget-cache.outputs.cache-hit != 'true' }}
                uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
                with:
                    path: ${{ github.workspace }}/.nuget/packages
                    key: ${{ steps.nuget-cache.outputs.cache-primary-key }}

    macos:
        name: macOS
        runs-on: macos-26
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            -   name: Cache Swift Packages
                id: swift-cache
                uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
                with:
                    path: |
                        macos/.build/repositories
                        macos/.build/checkouts
                        macos/.build/artifacts
                        macos/.build/workspace-state.json
                    key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('macos/Package.swift', 'macos/Package.resolved') }}

            # A debug build: FlockScreenshots reaches the app's views through @testable import.
            -   name: Render
                run: swift run --package-path macos FlockScreenshots --out screenshots

            -   uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
                if: always()
                with:
                    name: screenshots-macos
                    path: screenshots/*.png
                    if-no-files-found: error

            -   name: Save Swift Packages
                if: ${{ !cancelled() && steps.swift-cache.outcome == 'success' && steps.swift-cache.outputs.cache-hit != 'true' }}
                uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
                with:
                    path: |
                        macos/.build/repositories
                        macos/.build/checkouts
                        macos/.build/artifacts
                        macos/.build/workspace-state.json
                    key: ${{ steps.swift-cache.outputs.cache-primary-key }}
