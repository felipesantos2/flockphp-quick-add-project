# Labels pull requests by the files they change, as .github/labeler.yml says: "documentation" for
# PRs that change only docs/, and "os: mac", "os: windows" or "os: linux" for PRs that change that
# platform's app. Checked again on every push, and taken off once that's no longer true.
name: Labeler

on:
    # pull_request_target, so the token can label PRs from forks. It never checks out or runs the
    # PR's code; the labels come from .github/labeler.yml on the default branch.
    pull_request_target:

permissions:
    contents: read
    pull-requests: write

concurrency:
    group: labeler-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    label:
        name: Label
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13
                with:
                    sync-labels: true
