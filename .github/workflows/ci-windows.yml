name: Windows build

on:
    workflow_call:
        inputs:
            ref:
                type: string
                required: true
            version:
                type: string
                required: true
            code:
                type: string
                required: true

jobs:
    windows-check:
        name: Windows App (${{ matrix.name }})
        if: github.event_name == 'pull_request' && inputs.code == 'true'
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   name: Kit Tests
                        command: 'dotnet test windows/Flock.Kit.Tests'
                    # The installer build runs these too, but only in the merge queue and on a release.
                    -   name: Tray Tests
                        command: 'dotnet test windows/Flock.Tray.Tests -p:Platform=x64'
                    -   name: Tray Build
                        command: 'dotnet build windows/Flock.Tray -c Release -p:Platform=x64'
                    # FlockScreenshots compiles the app's sources with SCREENSHOTS defined, so a change can break
                    # it without touching it.
                    -   name: Screenshot Build
                        command: 'dotnet build windows/Flock.Screenshots -c Release -p:Platform=x64'
        runs-on: windows-2025
        env:
            NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                with:
                    ref: ${{ inputs.ref }}

            -   uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
                with:
                    dotnet-version: 10.0.x

            -   name: Cache NuGet Packages
                id: nuget-cache
                uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
                with:
                    path: ${{ github.workspace }}/.nuget/packages
                    key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-${{ hashFiles('windows/**/*.csproj', 'windows/**/*.props', 'windows/**/*.targets', '**/NuGet.Config', '**/nuget.config', 'global.json') }}

            -   name: ${{ matrix.name }}
                run: ${{ matrix.command }}

            -   name: Save NuGet Packages
                if: ${{ !cancelled() && steps.nuget-cache.outcome == 'success' && steps.nuget-cache.outputs.cache-hit != 'true' }}
                uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
                with:
                    path: ${{ github.workspace }}/.nuget/packages
                    key: ${{ steps.nuget-cache.outputs.cache-primary-key }}

    windows:
        name: Windows (x64)
        if: github.event_name != 'pull_request'
        runs-on: windows-2025
        environment: ${{ (github.event_name == 'merge_group' || (inputs.version != '' && !startsWith(inputs.version, 'dev-'))) && 'release' || '' }}
        permissions:
            contents: read
            id-token: write
        env:
            FLOCK_VERSION: ${{ inputs.version }}
            SIGNING: ${{ vars.ARTIFACT_SIGNING_ACCOUNT != '' }}
            NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                with:
                    ref: ${{ inputs.ref }}

            -   uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
                with:
                    go-version-file: go.mod

            -   uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
                with:
                    dotnet-version: 10.0.x

            -   name: Cache NuGet Packages
                id: nuget-cache
                uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
                with:
                    path: ${{ github.workspace }}/.nuget/packages
                    key: nuget-${{ runner.os }}-${{ runner.arch }}-installer-${{ hashFiles('windows/**/*.csproj', 'windows/**/*.props', 'windows/**/*.targets', '**/NuGet.Config', '**/nuget.config', 'global.json') }}

            -   name: Install Inno Setup
                #language=powershell
                run: |
                    if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
                      choco install innosetup --no-progress -y
                    }

            -   name: Require Signing
                if: env.SIGNING != 'true' && (github.event_name == 'merge_group' || (inputs.version != '' && !startsWith(inputs.version, 'dev-')))
                run: echo "::error::the ARTIFACT_SIGNING_* variables are not set" && exit 1

            -   uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
                if: env.SIGNING == 'true'
                with:
                    client-id: ${{ vars.AZURE_CLIENT_ID }}
                    tenant-id: ${{ vars.AZURE_TENANT_ID }}
                    allow-no-subscriptions: true

            -   name: Setup Signing
                if: env.SIGNING == 'true'
                env:
                    ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
                    ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
                    PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
                #language=powershell
                run: |
                    $client = "$env:RUNNER_TEMP\artifact-signing"
                    Invoke-WebRequest https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/1.0.146/microsoft.artifactsigning.client.1.0.146.nupkg -OutFile "$client.zip"
                    if ((Get-FileHash "$client.zip" -Algorithm SHA256).Hash -ne "7761E5D8F31E54B764DA21D33CD8B0A2940E1B05526C7DFCB5E94B0431426F70") {
                      throw "unexpected Microsoft.ArtifactSigning.Client package"
                    }
                    Expand-Archive "$client.zip" $client
                    @{
                      Endpoint = $env:ENDPOINT; CodeSigningAccountName = $env:ACCOUNT; CertificateProfileName = $env:PROFILE
                      ExcludeCredentials = @("EnvironmentCredential", "ManagedIdentityCredential", "WorkloadIdentityCredential",
                        "SharedTokenCacheCredential", "VisualStudioCredential", "VisualStudioCodeCredential",
                        "AzurePowerShellCredential", "AzureDeveloperCliCredential", "InteractiveBrowserCredential")
                    } | ConvertTo-Json | Set-Content "$client\metadata.json"
                    az account get-access-token --resource https://codesigning.azure.net --output none
                    if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                    "SIGN_DLIB=$client\bin\x64\Azure.CodeSigning.Dlib.dll" >> $env:GITHUB_ENV
                    "SIGN_METADATA=$client\metadata.json" >> $env:GITHUB_ENV

            -   name: Build Installer
                #language=powershell
                run: |
                    ./windows/build-installer.ps1
                    Move-Item windows/dist/Flock-Setup-x64.exe "windows/dist/Flock-Setup-$env:FLOCK_VERSION-x64.exe"

            -   name: Verify Signature
                if: env.SIGNING == 'true'
                #language=powershell
                run: |
                    $signature = Get-AuthenticodeSignature windows/dist/Flock-Setup-*-x64.exe
                    $signature | Format-List Status, StatusMessage, SignerCertificate, TimeStamperCertificate
                    if ($signature.Status -ne "Valid") { throw "the installer's signature is $($signature.Status)" }

            -   uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
                with:
                    name: flock-windows
                    path: windows/dist/Flock-Setup-*-x64.exe
                    if-no-files-found: error

            -   name: Save NuGet Packages
                if: ${{ !cancelled() && steps.nuget-cache.outcome == 'success' && steps.nuget-cache.outputs.cache-hit != 'true' }}
                uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
                with:
                    path: ${{ github.workspace }}/.nuget/packages
                    key: ${{ steps.nuget-cache.outputs.cache-primary-key }}
